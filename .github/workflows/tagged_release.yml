name: "Create Tagged Release"

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version number of the release'
        required: true

env:
  RELEASE_VERSION: ${{ github.event.inputs.release_version }}

permissions: { }

jobs:
  build:
    name: Create tagged release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-15-intel, windows-latest, ubuntu-latest ]

    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout project
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 #v6.0.1

      - name: Setup Git
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

      - name: Setup JDK
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: '25.0.3'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set Swap Space (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: pierotofy/set-swap-space@49819abfb41bd9b44fb781159c033dba90353a7c # master
        with:
          swap-size-gb: 12

      - name: Set versions
        if: matrix.os == 'ubuntu-latest'
        run: |
          release_branch_name=${RELEASE_VERSION%.*}.x
          echo "release_branch_name=$release_branch_name" >> $GITHUB_ENV

      - name: Create Release branch
        if: matrix.os == 'ubuntu-latest'
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "github-actions"
          git checkout -b ${{ env.release_branch_name }}
          git push origin ${{ env.release_branch_name }}

      - name: Set maven version
        if: matrix.os == 'macos-15-intel' || matrix.os == 'ubuntu-latest'
        run: mvn versions:set -DnewVersion="${{ env.RELEASE_VERSION }}"
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set maven version on Windows
        if: matrix.os == 'windows-latest'
        run: mvn versions:set -DnewVersion="${{ env.RELEASE_VERSION }}"
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}


      - name: Build Fat-jar
        run: |
          java --version
          export MAVEN_OPTS="-Xmx4096m"
          export JAVA_TOOL_OPTIONS="-Dfile.encoding=UTF8"
          # Build aspect model editor executable jar
          unset JAVA_TOOL_OPTIONS
          mvn -B clean install -DskipTests -Dmaven.wagon.httpconnectionManager.ttlSeconds=60
        shell: bash

      - name: Build package with jlink and jpackage (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          echo "Analyzing JAR dependencies with jdeps..."
          jdeps --multi-release base --ignore-missing-deps --print-module-deps \
            aspect-model-editor-runtime/target/aspect-model-editor-runtime-${{ env.RELEASE_VERSION }}.jar || true

          echo "Creating custom runtime with jlink..."
          jlink --no-header-files --no-man-pages --strip-debug --compress=zip-6 \
            --add-modules java.se,jdk.unsupported,jdk.crypto.ec,jdk.crypto.cryptoki,jdk.charsets,jdk.zipfs,jdk.management,jdk.attach,jdk.jfr \
            --output aspect-model-editor-runtime/target/jlink-runtime

          echo "Packaging application image with jpackage..."
          mkdir -p aspect-model-editor-runtime/target/jpackage-input
          cp aspect-model-editor-runtime/target/aspect-model-editor-runtime-${{ env.RELEASE_VERSION }}.jar aspect-model-editor-runtime/target/jpackage-input/

          jpackage --type app-image \
            --name ame-backend-${{ env.RELEASE_VERSION }}-linux \
            --input aspect-model-editor-runtime/target/jpackage-input \
            --main-jar aspect-model-editor-runtime-${{ env.RELEASE_VERSION }}.jar \
            --main-class org.eclipse.esmf.ame.Application \
            --runtime-image aspect-model-editor-runtime/target/jlink-runtime \
            --java-options "--enable-native-access=ALL-UNNAMED" \
            --java-options "--sun-misc-unsafe-memory-access=allow" \
            --java-options "-Dpolyglotimpl.DisableMultiReleaseCheck=true" \
            --dest aspect-model-editor-runtime/target

          cd aspect-model-editor-runtime/target
          tar -czvf ame-backend-v${{ env.RELEASE_VERSION }}-linux.tar.gz ame-backend-${{ env.RELEASE_VERSION }}-linux
          cd ../..

          rm -rf aspect-model-editor-runtime/target/jlink-runtime aspect-model-editor-runtime/target/jpackage-input
        shell: bash

      - name: Build package with jlink and jpackage (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          echo "Analyzing JAR dependencies with jdeps..."
          jdeps --multi-release base --ignore-missing-deps --print-module-deps \
            aspect-model-editor-runtime/target/aspect-model-editor-runtime-${{ env.RELEASE_VERSION }}.jar || true

          echo "Creating custom runtime with jlink..."
          jlink --no-header-files --no-man-pages --strip-debug --compress=zip-6 \
            --add-modules java.se,jdk.unsupported,jdk.crypto.ec,jdk.crypto.cryptoki,jdk.charsets,jdk.zipfs,jdk.management,jdk.attach,jdk.jfr \
            --output aspect-model-editor-runtime/target/jlink-runtime

          echo "Preparing input and extracting native DLLs..."
          mkdir -p aspect-model-editor-runtime/target/jpackage-input
          cp aspect-model-editor-runtime/target/aspect-model-editor-runtime-${{ env.RELEASE_VERSION }}.jar aspect-model-editor-runtime/target/jpackage-input/

          zstd_jar=$(mvn dependency:build-classpath -DincludeArtifactIds=zstd-jni | grep -E '\.jar$' | tr ';' '\n' | tr '\\' '/' | grep 'zstd-jni' | grep '\.jar$' | head -n 1)
          jna_jar=$(mvn dependency:build-classpath -DincludeArtifactIds=jna | grep -E '\.jar$' | tr ';' '\n' | tr '\\' '/' | grep 'jna' | grep '\.jar$' | head -n 1)
          api_jar=$(mvn dependency:build-classpath -DincludeArtifactIds=truffle-api | grep -E '\.jar$' | tr ';' '\n' | tr '\\' '/' | grep 'truffle-api' | grep '\.jar$' | head -n 1)

          if [ -n "$zstd_jar" ] && [ -f "$zstd_jar" ]; then
            jar_basename=$(basename "$zstd_jar")
            version="${jar_basename#zstd-jni-}"
            version="${version%.jar}"
            unzip -p "$zstd_jar" "win/amd64/libzstd-jni-${version}.dll" > "aspect-model-editor-runtime/target/jpackage-input/libzstd-jni-${version}.dll"
            cp "aspect-model-editor-runtime/target/jpackage-input/libzstd-jni-${version}.dll" "aspect-model-editor-runtime/target/jpackage-input/zstd-jni-${version}.dll"
          fi

          if [ -n "$jna_jar" ] && [ -f "$jna_jar" ]; then
            unzip -p "$jna_jar" "com/sun/jna/win32-x86-64/jnidispatch.dll" > "aspect-model-editor-runtime/target/jpackage-input/jnidispatch.dll"
          fi

          if [ -n "$api_jar" ] && [ -f "$api_jar" ]; then
            unzip -j "$api_jar" "META-INF/resources/engine/libtruffleattach/windows/amd64/bin/truffleattach.dll" -d "aspect-model-editor-runtime/target/jpackage-input" || true
          fi

          echo "Packaging application image with jpackage..."
          jpackage --type app-image \
            --name ame-backend-${{ env.RELEASE_VERSION }}-win \
            --input aspect-model-editor-runtime/target/jpackage-input \
            --main-jar aspect-model-editor-runtime-${{ env.RELEASE_VERSION }}.jar \
            --main-class org.eclipse.esmf.ame.Application \
            --runtime-image aspect-model-editor-runtime/target/jlink-runtime \
            --java-options "--enable-native-access=ALL-UNNAMED" \
            --java-options "--sun-misc-unsafe-memory-access=allow" \
            --java-options "-Dpolyglotimpl.DisableMultiReleaseCheck=true" \
            --java-options '-Djava.library.path=$APPDIR' \
            --java-options '-Djna.nounpack=true' \
            --java-options '-Djna.boot.library.path=$APPDIR' \
            --dest aspect-model-editor-runtime/target

          rm -rf aspect-model-editor-runtime/target/jlink-runtime aspect-model-editor-runtime/target/jpackage-input
        shell: bash

      - name: Build package with jlink and jpackage (Mac)
        if: matrix.os == 'macos-15-intel'
        run: |
          echo "Analyzing JAR dependencies with jdeps..."
          jdeps --multi-release base --ignore-missing-deps --print-module-deps \
            aspect-model-editor-runtime/target/aspect-model-editor-runtime-${{ env.RELEASE_VERSION }}.jar || true

          echo "Creating custom runtime with jlink..."
          jlink --no-header-files --no-man-pages --strip-debug --compress=zip-6 \
            --add-modules java.se,jdk.unsupported,jdk.crypto.ec,jdk.crypto.cryptoki,jdk.charsets,jdk.zipfs,jdk.management,jdk.attach,jdk.jfr \
            --output aspect-model-editor-runtime/target/jlink-runtime

          echo "Packaging application image with jpackage..."
          mkdir -p aspect-model-editor-runtime/target/jpackage-input
          cp aspect-model-editor-runtime/target/aspect-model-editor-runtime-${{ env.RELEASE_VERSION }}.jar aspect-model-editor-runtime/target/jpackage-input/

          jpackage --type app-image \
            --name ame-backend-${{ env.RELEASE_VERSION }}-mac \
            --input aspect-model-editor-runtime/target/jpackage-input \
            --main-jar aspect-model-editor-runtime-${{ env.RELEASE_VERSION }}.jar \
            --main-class org.eclipse.esmf.ame.Application \
            --runtime-image aspect-model-editor-runtime/target/jlink-runtime \
            --java-options "--enable-native-access=ALL-UNNAMED" \
            --java-options "--sun-misc-unsafe-memory-access=allow" \
            --java-options "-Dpolyglotimpl.DisableMultiReleaseCheck=true" \
            --dest aspect-model-editor-runtime/target

          rm -rf aspect-model-editor-runtime/target/jlink-runtime aspect-model-editor-runtime/target/jpackage-input
        shell: bash

      - name: Upload binary (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f #v6.0.0
        with:
          name: ame-backend-v${{ env.RELEASE_VERSION }}-win
          path: aspect-model-editor-runtime/target/ame-backend-${{ env.RELEASE_VERSION }}-win

      - name: Create proper zip with .app bundle
        if: matrix.os == 'macos-15-intel'
        run: |
          cd aspect-model-editor-runtime/target
          ditto -c -k ame-backend-${{ env.RELEASE_VERSION }}-mac.app ame-backend-v${{ env.RELEASE_VERSION }}-mac.zip

      - name: Upload binary (Mac)
        if: matrix.os == 'macos-15-intel'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f #v6.0.0
        with:
          name: ame-backend-v${{ env.RELEASE_VERSION }}-mac
          path: aspect-model-editor-runtime/target/ame-backend-v${{ env.RELEASE_VERSION }}-mac.zip

      - name: Upload binary (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f #v6.0.0
        with:
          name: ame-backend-v${{ env.RELEASE_VERSION }}-linux
          path: aspect-model-editor-runtime/target/ame-backend-v${{ env.RELEASE_VERSION }}-linux.tar.gz

      # Release Linux executables
      - name: Create GitHub release (Linux)
        if: ${{ (matrix.os == 'ubuntu-latest') &&  (!contains( github.ref, '-M' )) }}
        uses: svenstaro/upload-release-action@6b7fa9f267e90b50a19fef07b3596790bb941741 # v2.11.3
        with:
          file_glob: true
          overwrite: true
          prerelease: false
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: aspect-model-editor-runtime/target/ame-backend-v${{ env.RELEASE_VERSION }}-linux.tar.gz
          tag: v${{ env.RELEASE_VERSION }}

      - name: Create GitHub pre-release (Linux)
        if: ${{ (matrix.os == 'ubuntu-latest') &&  (contains( github.ref, '-M' )) }}
        uses: svenstaro/upload-release-action@6b7fa9f267e90b50a19fef07b3596790bb941741 # v2.11.3
        with:
          file_glob: true
          overwrite: true
          prerelease: true
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: aspect-model-editor-runtime/target/ame-backend-v${{ env.RELEASE_VERSION }}-linux.tar.gz
          tag: v${{ env.RELEASE_VERSION }}

      # Release Mac executables
      - name: Create GitHub release (Mac)
        if: ${{ (matrix.os == 'macos-15-intel') &&  (!contains( github.ref, '-M' )) }}
        uses: svenstaro/upload-release-action@6b7fa9f267e90b50a19fef07b3596790bb941741 # v2.11.3
        with:
          file_glob: true
          overwrite: true
          prerelease: false
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: aspect-model-editor-runtime/target/ame-backend-v${{ env.RELEASE_VERSION }}-mac.zip
          tag: v${{ env.RELEASE_VERSION }}

      - name: Create GitHub pre-release (Mac)
        if: ${{ (matrix.os == 'macos-15-intel') &&  (contains( github.ref, '-M' )) }}
        uses: svenstaro/upload-release-action@6b7fa9f267e90b50a19fef07b3596790bb941741 # v2.11.3
        with:
          file_glob: true
          overwrite: true
          prerelease: true
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: aspect-model-editor-runtime/target/ame-backend-v${{ env.RELEASE_VERSION }}-mac.zip
          tag: v${{ env.RELEASE_VERSION }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout project
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 #v6.0.1

      # Sign Windows executable
      - name: Get Artifact ID Windows
        shell: bash
        run: |
          # Get the list of artifacts for the specified workflow run
          response=$(curl -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository_owner }}/$(echo '${{ github.repository }}' | cut -d'/' -f2)/actions/runs/${{ github.run_id }}/artifacts")

          # Filter out the ID of the artifacts
          artifact_id_win=$(echo "$response" | jq -r '.artifacts[] | select(.name | contains("win")) | .id')

          # Save the artifact ID in an environment variable
          echo "ARTIFACT_ID_WIN=$artifact_id_win" >> $GITHUB_ENV
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit Artifact url and version changes and push to pre release branch for jenkins Windows
        shell: bash
        run: |
          ARTIFACT_URL_WIN="https://api.github.com/repos/eclipse-esmf/esmf-aspect-model-editor-backend/actions/artifacts/$ARTIFACT_ID_WIN/zip"
          BRANCH_NAME="pre_release_configuration"

          echo "artifact_url_win=$ARTIFACT_URL_WIN" > parameters.txt
          echo "version=${{ env.RELEASE_VERSION }}" >> parameters.txt

          git config --global user.email "github-actions@github.com"
          git config --global user.name "github-actions"
          git checkout -b $BRANCH_NAME
          git add parameters.txt
          git commit -m "Add parameters.txt with artifact_url_win and the version"
          git push origin $BRANCH_NAME
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger Jenkins Job, for signing executable
        shell: bash
        run: |
          DATA='{"repository": {"url": "https://github.com/eclipse-esmf/esmf-aspect-model-editor-backend", "html_url": "https://github.com/eclipse-esmf/esmf-aspect-model-editor-backend", "owner": { "name": "ESMF"}}, "pusher": { "name": "GitHub Action", "email": "esmf-dev@eclipse.org"}}'
          SHA1="$(echo -n "${DATA}" | openssl dgst -sha1 -hmac "${WEBHOOK_SECRET}" | sed 's/SHA1(stdin)= //')"
          curl -X POST https://ci.eclipse.org/esmf/github-webhook/ -H "Content-Type: application/json" -H "X-GitHub-Event: push" -H "X-Hub-Signature: sha1=${SHA1}" -d "${DATA}"
