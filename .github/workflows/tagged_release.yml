name: "Create Tagged Release"

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version number of the release, e.g. 2.3.0 or 2.3.0-rc1 (pre-release)'
        required: true

permissions: { }

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Validate version
        id: version
        env:
          RELEASE_VERSION: ${{ github.event.inputs.release_version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Invalid release version. Expected e.g. 2.3.0 or 2.3.0-rc1."
            exit 1
          fi
          prerelease=false
          if [[ "$RELEASE_VERSION" == *-rc* ]]; then prerelease=true; fi
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Checkout project
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 #v6.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create release branch and tag
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:refs/heads/${RELEASE_VERSION%.*}.x"
          git tag "v$RELEASE_VERSION"
          git push origin "v$RELEASE_VERSION"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          gh release create "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "v$RELEASE_VERSION" --notes "" --prerelease="$PRERELEASE"

  build:
    name: Build (${{ matrix.platform }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
          - os: macos-15-intel
            platform: mac-x64
          - os: macos-latest
            platform: mac-arm64
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      PLATFORM: ${{ matrix.platform }}
      TARGET: aspect-model-editor-runtime/target
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout project
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 #v6.0.1
        with:
          ref: v${{ needs.prepare.outputs.version }}
          persist-credentials: false

      - name: Setup JDK
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: '25.0.3'
          distribution: 'temurin'
          cache: maven

      - name: Set swap space (Linux)
        if: runner.os == 'Linux'
        uses: pierotofy/set-swap-space@49819abfb41bd9b44fb781159c033dba90353a7c # master
        with:
          swap-size-gb: 12

      - name: Build fat jar
        run: |
          java --version
          mvn -B versions:set -DnewVersion="$RELEASE_VERSION"
          MAVEN_OPTS="-Xmx4096m" mvn -B clean install -DskipTests -Dmaven.wagon.httpconnectionManager.ttlSeconds=60

      - name: Package app image
        id: app-image
        uses: ./.github/actions/package-app-image
        with:
          version: ${{ needs.prepare.outputs.version }}
          platform: ${{ matrix.platform }}
          archive-name: ame-backend-v${{ needs.prepare.outputs.version }}-${{ matrix.platform }}

      - name: Upload workflow artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f #v6.0.0
        with:
          name: ame-backend-v${{ needs.prepare.outputs.version }}-${{ matrix.platform }}
          path: ${{ steps.app-image.outputs.path }}

      - name: Upload to draft release
        if: runner.os != 'Windows'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSET: ${{ steps.app-image.outputs.path }}
        run: gh release upload "v$RELEASE_VERSION" "$ASSET" --repo "$GITHUB_REPOSITORY" --clobber

      # In the original repository the Windows app image is signed and uploaded by the Jenkins job,
      # a fork uploads the unsigned app image, so that the editor release of the fork can be built
      - name: Upload unsigned Windows app image to draft release (fork only)
        if: runner.os == 'Windows' && github.repository_owner != 'eclipse-esmf'
        shell: pwsh
        run: |
          $zip = "$env:TARGET/ame-backend-v$env:RELEASE_VERSION-win.zip"
          Compress-Archive -Path "$env:TARGET/ame-backend-$env:RELEASE_VERSION-win" -DestinationPath $zip
          gh release upload "v$env:RELEASE_VERSION" $zip --repo $env:GITHUB_REPOSITORY --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish release
    needs: [ prepare, build ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Publish release
        run: gh release edit "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --draft=false

      - name: Checkout project
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 #v6.0.1
        with:
          persist-credentials: false

      # Only in the original repository, so that test runs in a fork do not trigger the Eclipse Jenkins.
      # The Jenkins job reads parameters.txt from the branch pre_release_configuration, signs the Windows
      # app image and uploads it to the release.
      - name: Provide Windows artifact for the Jenkins job
        if: github.repository_owner == 'eclipse-esmf'
        run: |
          artifact_id_win=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name | endswith("-win")) | .id')
          if [ -z "$artifact_id_win" ]; then
            echo "::error::Windows artifact not found."
            exit 1
          fi

          echo "artifact_url_win=https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id_win/zip" > parameters.txt
          echo "version=$RELEASE_VERSION" >> parameters.txt

          git config user.name github-actions
          git config user.email github-actions@github.com
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # the branch of a previous release is replaced
          if git ls-remote --exit-code --heads origin pre_release_configuration > /dev/null; then
            git push origin --delete pre_release_configuration
          fi
          git checkout -b pre_release_configuration
          git add parameters.txt
          git commit -m "Add parameters.txt with artifact_url_win and the version"
          git push origin pre_release_configuration

      - name: Trigger Jenkins job for signing the Windows executable
        if: github.repository_owner == 'eclipse-esmf'
        run: |
          DATA='{"repository": {"url": "https://github.com/eclipse-esmf/esmf-aspect-model-editor-backend", "html_url": "https://github.com/eclipse-esmf/esmf-aspect-model-editor-backend", "owner": { "name": "ESMF"}}, "pusher": { "name": "GitHub Action", "email": "esmf-dev@eclipse.org"}}'
          SHA1="$(echo -n "${DATA}" | openssl dgst -sha1 -hmac "${WEBHOOK_SECRET}" | sed 's/SHA1(stdin)= //')"
          curl -X POST https://ci.eclipse.org/esmf/github-webhook/ -H "Content-Type: application/json" -H "X-GitHub-Event: push" -H "X-Hub-Signature: sha1=${SHA1}" -d "${DATA}"
