name: "Create Tagged Release"

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version number of the release'
        required: true

env:
  RELEASE_VERSION: ${{ github.event.inputs.release_version }}

permissions: { }

jobs:
  build:
    name: Create tagged release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-15-intel, windows-latest, ubuntu-latest ]

    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout project
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 #v6.0.1

      - name: Setup Git
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

      - name: Setup JDK
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: '25.0.3'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Configure Pagefile
        if: matrix.os == 'windows-latest'
        # Fix for "LINK : fatal error LNK1171: unable to load mspdbcore.dll (error code: 1455)":
        # This seems to be caused by running out of memory; increasing page file
        # size suggested here:
        # https://github.com/actions/virtual-environments/issues/3420#issuecomment-861342418
        uses: al-cheb/configure-pagefile-action@9b6da52fb72a3c6147c1aad2df22d8d905681adc # v1.5
        with:
          minimum-size: 16GB
          maximum-size: 16GB
          disk-root: "C:"

      - name: Set Swap Space (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: pierotofy/set-swap-space@49819abfb41bd9b44fb781159c033dba90353a7c # master
        with:
          swap-size-gb: 12

      - name: Set versions
        if: matrix.os == 'ubuntu-latest'
        run: |
          release_branch_name=${RELEASE_VERSION%.*}.x
          echo "release_branch_name=$release_branch_name" >> $GITHUB_ENV

      - name: Create Release branch
        if: matrix.os == 'ubuntu-latest'
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "github-actions"
          git checkout -b ${{ env.release_branch_name }}
          git push origin ${{ env.release_branch_name }}

      - name: Set maven version
        if: matrix.os == 'macos-15-intel' || matrix.os == 'ubuntu-latest'
        run: mvn versions:set -DnewVersion="${{ env.RELEASE_VERSION }}"
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set maven version on Windows
        if: matrix.os == 'windows-latest'
        run: mvn versions:set -DnewVersion="${{ env.RELEASE_VERSION }}"
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up MSVC
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Build Fat-jar
        run: |
          java --version
          export MAVEN_OPTS="-Xmx4096m"
          export JAVA_TOOL_OPTIONS="-Dfile.encoding=UTF8"
          # Build aspect model editor executable jar
          unset JAVA_TOOL_OPTIONS
          mvn -B clean install -DskipTests -Dmaven.wagon.httpconnectionManager.ttlSeconds=60
        shell: bash

      - name: Build warp packer (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          bundle="aspect-model-editor-bundle-${{ env.RELEASE_VERSION }}-$(date +%s)"
          mkdir ${bundle}
          curl -Lo jre.tar.gz https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.3%2B9/OpenJDK25U-jre_x64_linux_hotspot_25.0.3_9.tar.gz
          tar -xvf jre.tar.gz -C $bundle
          cp aspect-model-editor-runtime/target/aspect-model-editor-runtime-${{ env.RELEASE_VERSION }}.jar ./${bundle}/
          
          cp scripts/linux/run.sh ./${bundle}/
          chmod +x ./${bundle}/run.sh

          curl -Lo warp-packer https://github.com/kirbylink/warp/releases/download/v1.3.0/linux-x64.warp-packer
          if [ "$(sha256sum warp-packer | cut -d' ' -f1)" != "add6f937db8b9207d1bb81a900ef609f41875f07c6c8b2d596bfc134c8f285ff" ]; then
            echo "Warp packer checksum does not match"
            exit 1
          fi
          chmod +x warp-packer
          
          ./warp-packer pack --arch linux-x64 --input-dir ${bundle} --exec run.sh --output ame-backend-${{ env.RELEASE_VERSION }}-linux
          chmod +x ame-backend-${{ env.RELEASE_VERSION }}-linux
          
          cp ame-backend-${{ env.RELEASE_VERSION }}-linux aspect-model-editor-runtime/target/
        shell: bash

      - name: Build warp packer (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          bundle="aspect-model-editor-bundle-${{ env.RELEASE_VERSION }}-$(date +%s)"
          mkdir "$bundle"
          mkdir "$bundle/app"
          curl -Lo jre.zip https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.3%2B9/OpenJDK25U-jre_x64_windows_hotspot_25.0.3_9.zip
          unzip -q jre.zip -d "./$bundle"
          mv "./$bundle/jdk-25.0.3+9-jre" "./$bundle/jre"
          rm jre.zip

          mv aspect-model-editor-runtime/target/aspect-model-editor-runtime-${{ env.RELEASE_VERSION }}.jar "./$bundle/app"
          
          GOOS=windows GOARCH=amd64 go build -ldflags -H=windowsgui -o "./$bundle/run.exe" scripts/windows/run.go

          curl -Lo warp-packer.exe https://github.com/kirbylink/warp/releases/download/v1.3.0/windows-x64.warp-packer.exe
          if [ "$(sha256sum warp-packer.exe | cut -d' ' -f1)" != "483726e0eb10a43167c03c8e4f27a2901741affd245e5ec8ed45509f9dcd7a8a" ]; then
            echo "Warp packer checksum does not match"
            exit 1
          fi
          
          ./warp-packer.exe pack --arch windows-x64 --input-dir "$bundle" --exec run.exe --output ame-backend-${{ env.RELEASE_VERSION }}-win.exe

          mv ame-backend-${{ env.RELEASE_VERSION }}-win.exe aspect-model-editor-runtime/target/
        shell: bash

      - name: Build warp packer (Mac)
        if: matrix.os == 'macos-15-intel'
        run: |
          bundle="aspect-model-editor-bundle-${{ env.RELEASE_VERSION }}-$(date +%s)"
          mkdir ${bundle}
          curl -Lo jre.tar.gz https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.3%2B9/OpenJDK25U-jre_x64_mac_hotspot_25.0.3_9.tar.gz
          tar -xvf jre.tar.gz
          cp -r ./jdk-25.0.3+9-jre ./${bundle}/jre
          cp aspect-model-editor-runtime/target/aspect-model-editor-runtime-${{ env.RELEASE_VERSION }}.jar ./${bundle}/
          cp scripts/macos/run.sh ./${bundle}/
          chmod +x ./${bundle}/run.sh

          curl -Lo warp-packer https://github.com/kirbylink/warp/releases/download/v1.3.0/macos-x64.warp-packer
          if [ "$(shasum -a 256 warp-packer | cut -d' ' -f1)" != "311bd238d087ea92f486d3d754a0f11826d9bd49d6f8ae849e5d6f6089a2e9c9" ]; then
            echo "Warp packer checksum does not match"
            exit 1
          fi
          chmod +x warp-packer
          xattr -d com.apple.quarantine warp-packer || true

          ./warp-packer pack --arch macos-x64 --input-dir ${bundle} --exec run.sh --output ame-backend-${{ env.RELEASE_VERSION }}-mac
          chmod +x ame-backend-${{ env.RELEASE_VERSION }}-mac

          cp ame-backend-${{ env.RELEASE_VERSION }}-mac aspect-model-editor-runtime/target/
        shell: bash

      - name: Upload binary (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f #v6.0.0
        with:
          name: ame-backend-v${{ env.RELEASE_VERSION }}-win
          path: aspect-model-editor-runtime/target/ame-backend-${{ env.RELEASE_VERSION }}-win.exe

      - name: Create proper zip with .app bundle
        if: matrix.os == 'macos-15-intel'
        run: |
          cd aspect-model-editor-runtime/target
          ditto -c -k ame-backend-${{ env.RELEASE_VERSION }}-mac ame-backend-v${{ env.RELEASE_VERSION }}-mac.zip

      - name: Upload binary (Mac)
        if: matrix.os == 'macos-15-intel'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f #v6.0.0
        with:
          name: ame-backend-v${{ env.RELEASE_VERSION }}-mac
          path: aspect-model-editor-runtime/target/ame-backend-${{ env.RELEASE_VERSION }}-mac

      - name: Upload binary (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f #v6.0.0
        with:
          name: ame-backend-v${{ env.RELEASE_VERSION }}-linux
          path: aspect-model-editor-runtime/target/ame-backend-${{ env.RELEASE_VERSION }}-linux

      # Release Linux executables
      - name: Create GitHub release (Linux)
        if: ${{ (matrix.os == 'ubuntu-latest') &&  (!contains( github.ref, '-M' )) }}
        uses: svenstaro/upload-release-action@6b7fa9f267e90b50a19fef07b3596790bb941741 # v2.11.3
        with:
          file_glob: true
          overwrite: true
          prerelease: false
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: aspect-model-editor-runtime/target/ame-backend-${{ env.RELEASE_VERSION }}-linux
          tag: v${{ env.RELEASE_VERSION }}

      - name: Create GitHub pre-release (Linux)
        if: ${{ (matrix.os == 'ubuntu-latest') &&  (contains( github.ref, '-M' )) }}
        uses: svenstaro/upload-release-action@6b7fa9f267e90b50a19fef07b3596790bb941741 # v2.11.3
        with:
          file_glob: true
          overwrite: true
          prerelease: true
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: aspect-model-editor-runtime/target/ame-backend-${{ env.RELEASE_VERSION }}-linux
          tag: v${{ env.RELEASE_VERSION }}

      # Release Mac executables
      - name: Create GitHub release (Mac)
        if: ${{ (matrix.os == 'macos-15-intel') &&  (!contains( github.ref, '-M' )) }}
        uses: svenstaro/upload-release-action@6b7fa9f267e90b50a19fef07b3596790bb941741 # v2.11.3
        with:
          file_glob: true
          overwrite: true
          prerelease: false
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: aspect-model-editor-runtime/target/ame-backend-${{ env.RELEASE_VERSION }}-mac
          tag: v${{ env.RELEASE_VERSION }}

      - name: Create GitHub pre-release (Mac)
        if: ${{ (matrix.os == 'macos-15-intel') &&  (contains( github.ref, '-M' )) }}
        uses: svenstaro/upload-release-action@6b7fa9f267e90b50a19fef07b3596790bb941741 # v2.11.3
        with:
          file_glob: true
          overwrite: true
          prerelease: true
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: aspect-model-editor-runtime/target/ame-backend-${{ env.RELEASE_VERSION }}-mac
          tag: v${{ env.RELEASE_VERSION }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout project
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 #v6.0.1

      # Sign Windows executable
      - name: Get Artifact ID Windows
        shell: bash
        run: |
          # Get the list of artifacts for the specified workflow run
          response=$(curl -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository_owner }}/$(echo '${{ github.repository }}' | cut -d'/' -f2)/actions/runs/${{ github.run_id }}/artifacts")

          # Filter out the ID of the artifacts
          artifact_id_win=$(echo "$response" | jq -r '.artifacts[] | select(.name | contains("win")) | .id')

          # Save the artifact ID in an environment variable
          echo "ARTIFACT_ID_WIN=$artifact_id_win" >> $GITHUB_ENV
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit Artifact url and version changes and push to pre release branch for jenkins Windows
        shell: bash
        run: |
          ARTIFACT_URL_WIN="https://api.github.com/repos/eclipse-esmf/esmf-aspect-model-editor-backend/actions/artifacts/$ARTIFACT_ID_WIN/zip"
          BRANCH_NAME="pre_release_configuration"

          echo "artifact_url_win=$ARTIFACT_URL_WIN" > parameters.txt
          echo "version=${{ env.RELEASE_VERSION }}" >> parameters.txt

          git config --global user.email "github-actions@github.com"
          git config --global user.name "github-actions"
          git checkout -b $BRANCH_NAME
          git add parameters.txt
          git commit -m "Add parameters.txt with artifact_url_win and the version"
          git push origin $BRANCH_NAME
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger Jenkins Job, for signing executable
        shell: bash
        run: |
          DATA='{"repository": {"url": "https://github.com/eclipse-esmf/esmf-aspect-model-editor-backend", "html_url": "https://github.com/eclipse-esmf/esmf-aspect-model-editor-backend", "owner": { "name": "ESMF"}}, "pusher": { "name": "GitHub Action", "email": "esmf-dev@eclipse.org"}}'
          SHA1="$(echo -n "${DATA}" | openssl dgst -sha1 -hmac "${WEBHOOK_SECRET}" | sed 's/SHA1(stdin)= //')"
          curl -X POST https://ci.eclipse.org/esmf/github-webhook/ -H "Content-Type: application/json" -H "X-GitHub-Event: push" -H "X-Hub-Signature: sha1=${SHA1}" -d "${DATA}"
