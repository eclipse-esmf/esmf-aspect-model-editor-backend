name: Check New Pull Request

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ '**' ]

permissions: { }

jobs:
  build:
    name: Check if passes all requirements (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
          - os: macos-15-intel
            platform: mac-x64
          - os: macos-latest
            platform: mac-arm64
    env:
      PLATFORM: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout project
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 #v6.0.1
        with:
          persist-credentials: false

      - name: Setup JDK
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: '25.0.3'
          distribution: 'temurin'
          cache: maven

      - name: Set swap space (Linux)
        if: runner.os == 'Linux'
        uses: pierotofy/set-swap-space@49819abfb41bd9b44fb781159c033dba90353a7c # master
        with:
          swap-size-gb: 12

      - name: Build and run tests
        run: |
          java --version
          MAVEN_OPTS="-Xmx4096m" mvn -B clean install -Dmaven.wagon.httpconnectionManager.ttlSeconds=60

      - name: Package app image
        id: app-image
        uses: ./.github/actions/package-app-image
        with:
          version: DEV-SNAPSHOT
          platform: ${{ matrix.platform }}
          archive-name: ame-backend-DEV-SNAPSHOT-${{ matrix.platform }}

      - name: Run integration tests
        run: |
          case "$RUNNER_OS" in
            Linux) image=linux ;;
            Windows) image=windows ;;
            macOS) image=mac ;;
          esac
          mvn -B verify -DskipTests \
            -P "dependencies-for-integration-tests,start-$image-image-for-integration-tests,run-bruno-integration-tests" \
            -Dos.platform="$PLATFORM" -Dmaven.shade.skip=true -Dmaven.jar.skip=true
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Linux and macOS: the tar.gz is uploaded as it is (archive: false), so the download is the tar.gz itself
      # and not a zip containing it. The artifact is named like the file.
      - name: Upload app image archive (Linux, macOS)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          path: ${{ steps.app-image.outputs.path }}
          archive: false
          if-no-files-found: error

      # Windows: the app image folder is zipped by the upload
      - name: Upload app image (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: ame-backend-DEV-SNAPSHOT-${{ matrix.platform }}
          path: ${{ steps.app-image.outputs.path }}
          if-no-files-found: error
